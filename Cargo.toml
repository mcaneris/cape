[workspace]
members = ["cape"]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }

 
